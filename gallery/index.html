<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | LEM.CO Lab</title>
    <link rel="icon" href="../images/lemon.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <div class="dashboard gallery-dashboard">
        <aside class="sidebar">
            <div class="sidebar_brand">
                <div class="brand_image">
                    <img src="../images/lemon.png" alt="LEM.CO">
                </div>
                <div class="brand_text">
                    <strong>LEM.CO</strong>
                    <span>LAB</span>
                </div>
            </div>

            <nav class="sidebar_navigation" aria-label="Main navigation">
                <a href="../index.html" class="sidebar_link">
                    <span class="sidebar_icon">⌂</span>
                    <span>Home</span>
                </a>
                <a href="../music-maker/tutorial.html" class="sidebar_link">
                    <span class="sidebar_icon">♫</span>
                    <span>Music Maker</span>
                </a>
                <a href="../drawing-hub/dist/index.html" class="sidebar_link">
                    <span class="sidebar_icon">✎</span>
                    <span>Drawing Lab</span>
                </a>
                <a href="./index.html" class="sidebar_link active" aria-current="page">
                    <span class="sidebar_icon">▣</span>
                    <span>Gallery</span>
                </a>
                <a href="../story/index.html" class="sidebar_link">
                    <span class="sidebar_icon">▤</span>
                    <span>Our Story</span>
                </a>
                <a href="../mission/index.html" class="sidebar_link">
                    <span class="sidebar_icon">★</span>
                    <span>Our Mission</span>
                </a>
                <a href="../credits/index.html" class="sidebar_link">
                    <span class="sidebar_icon">ⓘ</span>
                    <span>Credits</span>
                </a>
            </nav>

            <div class="sidebar_bottom">
                <a href="../story/index.html" class="sidebar_small_link">
                    <span>?</span>
                    <span>About</span>
                </a>
            </div>
        </aside>

        <main class="main_area gallery-main">
            <header class="top_bar">
                <button class="back_button" type="button" onclick="location.href='../index.html'" aria-label="Back to main menu">←</button>
                <div class="top_bar_spacer"></div>

                <div class="top_controls">
                    <select id="language_selector" aria-label="Language">
                        <option value="en">English</option>
                        <option value="id">Indonesian</option>
                    </select>

                    <div class="preferences_wrapper">
                        <button id="preferences_button" class="preferences_button" type="button" title="Preferences" aria-expanded="false" aria-controls="preferences_menu">⚙</button>
                        <div id="preferences_menu" class="preferences_menu" hidden>
                            <div class="preferences_title">Preferences</div>
                            <label class="preference_option">
                                <input type="checkbox" id="ads_toggle">
                                <span>Show ad bars</span>
                            </label>
                            <label class="preference_option">
                                <input type="checkbox" id="music_toggle">
                                <span>Background music</span>
                            </label>
                        </div>
                    </div>

                    <button id="light_mode_button" class="theme_button active" type="button" title="Light mode">☀</button>
                    <button id="dark_mode_button" class="theme_button" type="button" title="Dark mode">☾</button>
                </div>
            </header>

            <section class="gallery-page" aria-label="Artwork gallery">
                <div class="gallery-heading">
                    <div>
                        <p class="gallery-eyebrow">LEM.CO / COMMUNITY</p>
                        <h1>Gallery</h1>
                        <p class="gallery-subtitle">A collection of work, experiments, and ideas.</p>
                    </div>
                    <span class="gallery-count">ARTWORKS / 001—009</span>
                </div>

                <div class="artwork-grid">
                    <button class="artwork-card" type="button" aria-label="Artwork 1">
                        <span class="artwork-frame frame-purple">
                            <img
                                class="artwork-image"
                                src="artworks/artwork1.png"
                                alt="Artwork 1"
                                loading="lazy"
                            >
                        </span>
                    </button>

                    <button class="artwork-card" type="button" aria-label="Artwork 2">
                        <span class="artwork-frame frame-white">
                            <img
                                class="artwork-image"
                                src="images/artwork-02.jpg"
                                alt="Artwork 2"
                                loading="lazy"
                            >
                        </span>
                    </button>

                    <button class="artwork-card" type="button" aria-label="Artwork 3">
                        <span class="artwork-frame frame-purple">
                            <img
                                class="artwork-image"
                                src="images/artwork-03.png"
                                alt="Artwork 3"
                                loading="lazy"
                            >
                        </span>
                    </button>

                    <button class="artwork-card" type="button" aria-label="Artwork 4">
                        <span class="artwork-frame frame-white">
                            <img
                                class="artwork-image"
                                src="images/artwork-04.jpg"
                                alt="Artwork 4"
                                loading="lazy"
                            >
                        </span>
                    </button>

                    <button class="artwork-card" type="button" aria-label="Artwork 5">
                        <span class="artwork-frame frame-purple">
                            <img
                                class="artwork-image"
                                src="images/artwork-05.png"
                                alt="Artwork 5"
                                loading="lazy"
                            >
                        </span>
                    </button>

                    <button class="artwork-card" type="button" aria-label="Artwork 6">
                        <span class="artwork-frame frame-white">
                            <img
                                class="artwork-image"
                                src="images/artwork-06.jpg"
                                alt="Artwork 6"
                                loading="lazy"
                            >
                        </span>
                    </button>

                    <button class="artwork-card" type="button" aria-label="Artwork 7">
                        <span class="artwork-frame frame-purple">
                            <img
                                class="artwork-image"
                                src="images/artwork-07.png"
                                alt="Artwork 7"
                                loading="lazy"
                            >
                        </span>
                    </button>

                    <button class="artwork-card" type="button" aria-label="Artwork 8">
                        <span class="artwork-frame frame-white">
                            <img
                                class="artwork-image"
                                src="images/artwork-08.jpg"
                                alt="Artwork 8"
                                loading="lazy"
                            >
                        </span>
                    </button>

                    <button class="artwork-card" type="button" aria-label="Artwork 9">
                        <span class="artwork-frame frame-purple">
                            <img
                                class="artwork-image"
                                src="images/artwork-09.png"
                                alt="Artwork 9"
                                loading="lazy"
                            >
                        </span>
                    </button>
                </div>

                <footer class="gallery-footer">
                    <span>MAKE SOMETHING. SHARE SOMETHING.</span>
                    <span>LEM.CO LAB ©</span>
                </footer>
            </section>
        </main>
    </div>

    <script src="../script.js"></script>
</body>
</html>
