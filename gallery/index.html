<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | LEM.CO Lab</title>
  <link rel="icon" href="../images/lemon.png">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
<div class="dashboard gallery-dashboard">
  <aside class="sidebar">
    <div class="sidebar_brand">
      <div class="brand_image"><img src="../images/lemon.png" alt="LEM.CO"></div>
      <div class="brand_text"><strong>LEM.CO</strong><span>LAB</span></div>
    </div>
    <nav class="sidebar_navigation" aria-label="Main navigation">
      <a href="../index.html" class="sidebar_link"><span class="sidebar_icon">⌂</span><span>Home</span></a>
      <a href="../music-maker/tutorial.html" class="sidebar_link"><span class="sidebar_icon">♫</span><span>Music Maker</span></a>
      <a href="../drawing-hub/dist/index.html" class="sidebar_link"><span class="sidebar_icon">✎</span><span>Drawing Lab</span></a>
      <a href="./index.html" class="sidebar_link active" aria-current="page"><span class="sidebar_icon">▣</span><span>Gallery</span></a>
      <a href="../story/index.html" class="sidebar_link"><span class="sidebar_icon">▤</span><span>Our Story</span></a>
      <a href="../mission/index.html" class="sidebar_link"><span class="sidebar_icon">★</span><span>Our Mission</span></a>
      <a href="../credits/index.html" class="sidebar_link"><span class="sidebar_icon">ⓘ</span><span>Credits</span></a>
    </nav>
    <div class="sidebar_bottom"><a href="../story/index.html" class="sidebar_small_link"><span>?</span><span>About</span></a></div>
  </aside>

  <main class="main_area gallery-main">
    <header class="top_bar">
      <button class="back_button" type="button" onclick="location.href='../index.html'" aria-label="Back">←</button>
      <div class="top_bar_spacer"></div>
      <div class="top_controls">
        <select id="language_selector" aria-label="Language"><option value="en">English</option><option value="id">Indonesian</option></select>
        <button id="light_mode_button" class="theme_button active" type="button" title="Light mode">☀</button>
        <button id="dark_mode_button" class="theme_button" type="button" title="Dark mode">☾</button>
      </div>
    </header>

    <section class="gallery-page">
      <div class="gallery-toolbar">
        <div class="collection-heading"><h2>Painting collection</h2><p>SELECTED PAINTINGS</p></div>
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Find a painting..." autocomplete="off"></label>
        <span class="gallery-count" id="artworkCount">00 WORKS</span>
      </div>
      <div class="artwork-grid" id="artworkGrid" aria-live="polite"></div>
      <footer class="gallery-footer"><span>LEM.CO <span></footer>
    </section>
  </main>
</div>

<dialog class="gallery-dialog artwork-dialog" id="detailDialog">
  <div class="detail-content">
    <button type="button" class="close-dialog detail-close" id="closeDetail" aria-label="Close artwork details">×</button>
    <div class="detail-image-wrap"><img id="detailImage" alt=""></div>
    <div class="detail-info">
      <p class="gallery-eyebrow" id="detailCategory"></p>
      <h2 id="detailTitle"></h2>
      <p class="detail-artist" id="detailArtist"></p>
      <p class="detail-description" id="detailDescription"></p>
      <div class="detail-bottom"><span id="detailYear"></span><button class="download-button" id="downloadArtwork" type="button">↓ Save image</button></div>
    </div>
  </div>
</dialog>
<script src="../script.js"></script>
<script src="gallery.js"></script>
</body>
</html>
