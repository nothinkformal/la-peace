<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Lab - Lem CO Lab</title>
<link rel="stylesheet" href="style-t.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="sidebar_brand">
            <div class="brand_image"><img src="../images/lemon.png" alt="Lem CO Lab"></div>
            <div class="brand_text"><strong>LEM CO</strong><span>LAB</span></div>
        </div>
        <nav class="sidebar_navigation">
            <a href="../index.html" class="sidebar_link"><span class="sidebar_icon">⌂</span>Home</a>
            <a href="../music-maker/tutorial.html" class="sidebar_link"><span class="sidebar_icon">♫</span>Music Maker</a>
            <a href="../gallery/index.html" class="sidebar_link"><span class="sidebar_icon">▣</span>Gallery</a>
            <a href="../story/index.html" class="sidebar_link"><span class="sidebar_icon">▤</span>The Story</a>
            <a href="../mission/index.html" class="sidebar_link"><span class="sidebar_icon">★</span>Our Mission</a>
            <a href="../credits/index.html" class="sidebar_link"><span class="sidebar_icon">ⓘ</span>Credits</a>
        </nav>
        <div class="sidebar_bottom"><a href="../story/index.html" class="sidebar_small_link">?　About</a></div>
    </aside>

    <main class="main_area">
        <header class="top_bar">
            <button class="back_button" type="button" onclick="window.history.back()" aria-label="Go back">←</button>
            <div class="top_bar_spacer"></div>
            <div class="top_controls">
                <select id="language_selector" aria-label="Select language">
                    <option value="en">English</option>
                    <option value="id">Indonesian</option>
                </select>
                <button id="light_mode_button" class="theme_button active" type="button" title="Light mode">☀</button>
                <button id="dark_mode_button" class="theme_button" type="button" title="Dark mode">☾</button>
            </div>
        </header>

        <div class="content">
            <section class="page_content">
                <header class="page_header">
                    <span class="page_label">LEM.CO TOOLS</span>
                    <h1>Choose Your Destination</h1>
                    <p class="page_subtitle">Where do you wish go?</p>
                </header>

                <section class="lab_picker" aria-label="Choose a creative lab">
                    <a class="lab_card drawing_lab" href="dist/index.html" aria-label="Enter Drawing Lab">
                        <span class="lab_card_number">01</span>
                        <span class="lab_card_icon" aria-hidden="true">
                            <svg viewBox="0 0 120 120" role="presentation">
                                <path d="M22 82 L76 28 L94 46 L40 100 L18 104 Z"
                                      fill="none" stroke="currentColor" stroke-width="8"
                                      stroke-linejoin="round"/>
                                <path d="M68 36 L86 54" fill="none" stroke="currentColor"
                                      stroke-width="8" stroke-linecap="round"/>
                                <path d="M18 104 L40 100 L22 82 Z" fill="currentColor"/>
                                <path d="M76 28 L84 20 Q90 14 96 20 L100 24 Q106 30 100 36 L94 42"
                                      fill="none" stroke="currentColor" stroke-width="7"
                                      stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span class="lab_card_title">DRAWING LAB</span>
                        <span class="lab_card_description">Create drawings or sketches</span>
                        <span class="lab_card_action">ENTER LAB ↗</span>
                    </a>

                    <a class="lab_card animation_lab" href="../animation-lab/dist/index.html" aria-label="Enter Animation Lab">
                        <span class="lab_card_number">02</span>
                        <span class="lab_card_icon" aria-hidden="true">
                            <svg viewBox="0 0 120 120" role="presentation">
                                <rect x="15" y="22" width="90" height="76" rx="5"
                                      fill="none" stroke="currentColor" stroke-width="8"/>
                                <path d="M15 42 H105 M15 78 H105"
                                      fill="none" stroke="currentColor" stroke-width="7"/>
                                <path d="M32 22 V42 M60 22 V42 M88 22 V42
                                         M32 78 V98 M60 78 V98 M88 78 V98"
                                      fill="none" stroke="currentColor" stroke-width="6"/>
                                <path d="M51 52 L75 60 L51 69 Z" fill="currentColor"/>
                            </svg>
                        </span>
                        <span class="lab_card_title">ANIMATION LAB</span>
                        <span class="lab_card_description">Create animations</span>
                        <span class="lab_card_action">ENTER LAB ↗</span>
                    </a>
                </section>
            </section>
        </div>
    </main>
</div>
<script src="../script.js"></script>
</body>
</html>
