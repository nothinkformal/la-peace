<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar_brand">
                <div class="brand_image">
                    <img src="../images/lemon.png" alt="La Peace Lab">
                </div>

                <div class="brand_text">
                    <strong>LEM CO</strong>
                    <span>LAB</span>
                </div>
            </div>

            <nav class="sidebar_navigation">

                <a href="../index.html" class="sidebar_link">
                    <span class="sidebar_icon">⌂</span>
                    <span id="home_link">Home</span>
                </a>

                <a href="../music-maker/tutorial.html" class="sidebar_link">
                    <span class="sidebar_icon">♫</span>
                    <span id="music_link">Music Maker</span>
                </a>

                <a href="../gallery/index.html" class="sidebar_link">
                    <span class="sidebar_icon">▣</span>
                    <span id="gallery_link">Gallery</span>
                </a>

                <a href="../story/index.html" class="sidebar_link active">
                    <span class="sidebar_icon">▤</span>
                    <span id="story_link">The Story</span>
                </a>

                <a href="../mission/index.html" class="sidebar_link">
                    <span class="sidebar_icon">★</span>
                    <span id="mission_link">Our Mission</span>
                </a>

                <a href="../credits/index.html" class="sidebar_link">
                    <span class="sidebar_icon">ⓘ</span>
                    <span id="credits_link">Credits</span>
                </a>

            </nav>

            <div class="sidebar_bottom">
                <a href="../story/index.html" class="sidebar_small_link">
                    <span>?</span>
                    <span>About</span>
                </a>
            </div>

        </aside>


        <!-- MAIN AREA -->
        <main class="main_area">

            <header class="top_bar">

                <button
                    class="back_button"
                    type="button"
                    onclick="window.history.back()"
                    aria-label="Go back"
                >
                    ←
                </button>

                <div class="top_bar_spacer"></div>

                <div class="top_controls">

                    <select id="language_selector" aria-label="Select language">
                        <option value="en">English</option>
                        <option value="id">Indonesian</option>
                    </select>

                    <button
                        id="light_mode_button"
                        class="theme_button active"
                        type="button"
                        title="Light mode"
                        aria-label="Light mode"
                    >
                        ☀
                    </button>

                    <button
                        id="dark_mode_button"
                        class="theme_button"
                        type="button"
                        title="Dark mode"
                        aria-label="Dark mode"
                    >
                        ☾
                    </button>

                </div>

            </header>


            <!-- PAGE CONTENT -->
            <div class="content">

                <section class="page_content">

                    <div class="page_header">

                        <span class="page_label">Lem CO</span>

                        <h1>Music Theory</h1>

                        <p class="page_subtitle">
                            Understanding music theory and its connection to the music industry.
                        </p>

                    </div>


                    <!-- PAGINATED STORY PANEL -->
                    <div class="page_body">

                        <div class="story_panel">

                            <span class="story_label" id="story_page_label">
                                PAGE 1 OF 4
                            </span>

                            <div id="story_content" aria-live="polite">
                                <noscript>
                                    JavaScript is required to display the music theory pages.
                                </noscript>
                            </div>

                            <nav class="story_navigation" aria-label="Story page navigation">

                                <button
                                    id="previous_page"
                                    type="button"
                                    disabled
                                >
                                    ← Previous
                                </button>

                                <span id="page_indicator" aria-live="polite">
                                    1 / 4
                                </span>

                                <button id="next_page" type="button">
                                    Next →
                                </button>

                            </nav>

                        </div>

                    </div>

                </section>

            </div>

        </main>

    </div>


    <!-- SHARED WEBSITE SCRIPT: THEME AND OTHER GLOBAL FEATURES -->
    <script src="../script.js"></script>

    <!-- STORY PAGE NAVIGATION AND CONTENT -->
    <script src="script.js"></script>
